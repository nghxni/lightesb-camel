# LightESB 动态路由配置
# 此文件包含 LightESB 的所有配置参数
# 可以根据不同环境（开发、测试、生产）修改相应的参数值

# =============================================================================
# 默认配置（所有环境通用）
# =============================================================================

# Logging Configuration
logging.level.com.oureman.soa.lightesb=INFO
logging.level.org.apache.camel=INFO

# =============================================================================
# AI 日志管理（ChatModel + Agent + Tools）
# 默认关闭，配置模型后再开启
# =============================================================================
# 功能开关与访问控制
# enabled: 是否启用 AI 日志管理能力
# read-only: 只读模式（true 时仅查询/演练，不会实际改级别）
# auth-token: 可选鉴权令牌，留空表示不校验
lightesb.ai.logging.enabled=true
lightesb.ai.logging.read-only=false
lightesb.ai.logging.auth-token=
# base-url: 业务管理接口根地址（/api/logging、/actuator）
# agent-gateway-url: AI 路由网关地址（AiLogControlSrv 对外入口）
lightesb.ai.logging.base-url=http://localhost:8080
lightesb.ai.logging.agent-gateway-url=http://localhost:19093/api/ai/logging/agent
# default-revert-minutes: 默认回滚时间（实际回滚由既有接口机制处理）
lightesb.ai.logging.default-revert-minutes=30
# allowed-logger-prefixes: 应用日志可操作前缀白名单（Actuator 目标）
lightesb.ai.logging.allowed-levels=TRACE,DEBUG,INFO,WARN,ERROR
lightesb.ai.logging.allowed-logger-prefixes=com.oureman.soa.lightesb,org.apache.camel
lightesb.ai.logging.system-message=你是LightESB日志管理助手。你只能执行日志管理相关操作，只能使用可用工具，不要编造结果。修改前先确认目标与级别，输出简洁中文结果。当工具返回requiresClarification=true后，下一轮若用户提供版本号/候选信息，必须继续调用工具，不得闲聊或直接下结论。若候选仍不唯一，必须要求补充唯一serviceKey，不得编造最终日志结论。
lightesb.ai.logging.clarification-fallback-enabled=true
lightesb.ai.logging.clarification.max-turns=5

# AI 模型注册表本地验证配置
# route 使用 Responses 形态，便于 AI 路由生成/微调续接；chat 使用 OpenAI-compatible Chat Completions，便于 Agent + Tools 工具调用。
# 注意：custom.api-type=chat-completions 的 base-url 需要写到 /v1；custom.api-type=responses 的 base-url 不带 /v1。
lightesb.ai.default-model=custom-codex-chat
lightesb.ai.models.custom-codex-responses.provider=custom
lightesb.ai.models.custom-codex-responses.name=gpt-5.5
lightesb.ai.models.custom-codex-responses.temperature=0.1
lightesb.ai.models.custom-codex-responses.max-tokens=8192
lightesb.ai.models.custom-codex-responses.timeout-seconds=120
lightesb.ai.models.custom-codex-responses.custom.api-type=responses
lightesb.ai.models.custom-codex-responses.custom.api-key=${OPENAI_API_KEY:}
lightesb.ai.models.custom-codex-responses.custom.base-url=https://api.apikey.fun
lightesb.ai.models.custom-codex-responses.custom.model-name=gpt-5.5

lightesb.ai.models.custom-codex-chat.provider=custom
lightesb.ai.models.custom-codex-chat.name=gpt-5.5
lightesb.ai.models.custom-codex-chat.temperature=0.1
lightesb.ai.models.custom-codex-chat.max-tokens=8192
lightesb.ai.models.custom-codex-chat.timeout-seconds=120
lightesb.ai.models.custom-codex-chat.custom.api-type=chat-completions
lightesb.ai.models.custom-codex-chat.custom.api-key=${OPENAI_API_KEY:}
lightesb.ai.models.custom-codex-chat.custom.base-url=https://api.apikey.fun/v1
lightesb.ai.models.custom-codex-chat.custom.model-name=gpt-5.5


lightesb.ai.agents.chat.model-ref=custom-codex-chat
lightesb.ai.agents.chat.memory.enabled=false
lightesb.ai.agents.chat.memory.max-messages=20
lightesb.ai.agents.chat.memory.max-sessions=1000
lightesb.ai.agents.chat.memory.ttl-seconds=1800

lightesb.ai.agents.route.model-ref=custom-codex-responses
lightesb.ai.agents.route.temperature=0.1
lightesb.ai.agents.route.max-tokens=8192
lightesb.ai.agents.route.timeout-seconds=120
lightesb.ai.agents.route.json-repair-retry=1

# lightesb.ai.agents.route.model-ref=default
lightesb.ai.models.default.provider=dashscope
lightesb.ai.models.default.dashscope.api-key=${DASHSCOPE_API_KEY:}
lightesb.ai.models.default.dashscope.model-name=qwen-plus
lightesb.ai.models.default.dashscope.top-p=0.8

# LightESB Configuration
# 配置管理相关配置
lightesb.trial.start-date=2026-04-03
lightesb.route.directory=lightesb-camel-app
# lightesb.route.temp-only-service=PlatformHttp

# MySQL数据库连接配置,引擎自用,使用前需要配置
lightesb.mysql.url=jdbc:mysql://localhost:3306/test?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
lightesb.mysql.driver=com.mysql.cj.jdbc.Driver
lightesb.mysql.username=root
lightesb.mysql.password=root

