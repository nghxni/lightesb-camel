# Robot rosbridge mock sample common config
HTTP.Listener=false
server.running=false
server.port=19210
port.level=version
system.components=robotics

SYSTEMID=CSIP
system.name=csip
system.version=1.0.0
system.description=LightESB robot rosbridge mock sample
service.type=EVENT
service.impl=ROSBRIDGE
service.provider=LIGHTESB

robot.siteId=site-a
robot.command.allowedActions=move_to,pause,resume,stop
robot.command.allowedRobotIds=quad-001,humanoid-001
robot.asset.quad-001.capabilities=move_to,pause,resume,stop
robot.asset.quad-001.online=true
robot.asset.humanoid-001.capabilities=move_to,pause,resume,stop
robot.asset.humanoid-001.online=true
robot.policy.target.minX=0
robot.policy.target.maxX=20
robot.policy.target.minY=0
robot.policy.target.maxY=20
robot.policy.maxSpeed=0.8
robot.rosbridge.status.topic=/robot/{robotId}/state
robot.rosbridge.action.service=/robot/{robotId}/action/{commandType}
robot.mock.ros.subscribe.sink=mock:robotRosSubscribeSink
robot.mock.ros.publish.sink=mock:robotRosPublishSink
robot.mock.ros.service.sink=mock:robotRosServiceSink
robot.mock.ros.reject.sink=mock:robotRosRejectSink
robot.mock.ros.action.sink=mock:robotRosActionSink
robot.mock.result.sink=mock:robotRosResultSink
