# Robot VDA 5050 mock sample common config
HTTP.Listener=false
server.running=false
server.port=19240
port.level=version
system.components=robotics

SYSTEMID=CSIP
system.name=csip
system.version=1.0.0
system.description=LightESB robot VDA 5050 mock sample
service.type=HTTP
service.impl=MQTT5
service.provider=LIGHTESB

robot.siteId=site-a
robot.command.allowedActions=vda_order,vda_instant_action
robot.command.allowedRobotIds=amr-001
robot.asset.amr-001.type=amr
robot.asset.amr-001.capabilities=vda_order,vda_instant_action
robot.asset.amr-001.online=true

robot.command.vda_order.schemaKey=amr.vda_order.v3_0
robot.command.vda_instant_action.schemaKey=amr.vda_instant_action.v3_0

robot.vda5050.version=3.0.0
robot.vda5050.manufacturer=ExampleAGV
robot.vda5050.order.topic.pattern=uagv/{siteId}/{robotId}/order
robot.vda5050.instantAction.topic.pattern=uagv/{siteId}/{robotId}/instantActions

# mock-only：无 broker/凭据配置，不连接真实端点
robot.mock.vda5050.order.sink=mock:robotVda5050OrderSink
robot.mock.vda5050.instantAction.sink=mock:robotVda5050InstantActionSink
