# Robot OPC UA station mock sample common config
HTTP.Listener=false
server.running=false
server.port=19220
port.level=version
system.components=robotics,industrial

SYSTEMID=CSIP
system.name=csip
system.version=1.0.0
system.description=LightESB robot OPC UA station mock sample
service.type=SCADA
service.impl=OPCUA
service.provider=LIGHTESB

robot.siteId=site-a
robot.command.allowedActions=pick,place
robot.command.allowedRobotIds=arm-001
robot.asset.arm-001.capabilities=pick,place
robot.asset.arm-001.online=true
robot.policy.allowedStationIds=station-a
robot.station.station-a.interlocked=true
robot.policy.maxPayloadKg=5.0
industrial.opcua.read.node=ns=2;s=Robot.Station.State
industrial.opcua.write.node=ns=2;s=Robot.Station.Command
robot.mock.opcua.read.sink=mock:robotOpcUaReadSink
robot.mock.opcua.write.sink=mock:robotOpcUaWriteSink
robot.mock.opcua.event.sink=mock:robotOpcUaEventSink
robot.mock.audit.sink=mock:robotOpcUaAuditSink
