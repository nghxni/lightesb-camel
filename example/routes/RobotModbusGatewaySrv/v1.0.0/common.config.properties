# Robot Modbus gateway mock sample common config
HTTP.Listener=false
server.running=false
server.port=19221
port.level=version
system.components=robotics

SYSTEMID=CSIP
system.name=csip
system.version=1.0.0
system.description=LightESB robot Modbus TCP gateway mock sample
service.type=SCADA
service.impl=MODBUS
service.provider=LIGHTESB

robot.siteId=site-a
robot.modbus.register.heartbeat.read=holding-register:1
robot.modbus.register.commandCode.write=holding-register:10
robot.modbus.register.alarmCode.read=holding-register:20
robot.modbus.map.heartbeat.register=holding-register:1
robot.modbus.map.heartbeat.access=read
robot.modbus.map.heartbeat.dataType=uint16
robot.modbus.map.commandCode.register=holding-register:10
robot.modbus.map.commandCode.access=write
robot.modbus.map.commandCode.dataType=uint16
robot.modbus.map.alarmCode.register=holding-register:20
robot.modbus.map.alarmCode.access=read
robot.modbus.map.alarmCode.dataType=uint16
robot.mock.modbus.read.sink=mock:robotModbusReadSink
robot.mock.modbus.write.sink=mock:robotModbusWriteSink
robot.mock.modbus.event.sink=mock:robotModbusEventSink
