# LightESB AiAgentDemoSrv - 服务特定配置

# 服务基本信息
service.name=AiAgentDemoSrv
service.version=1.0.0
server.running=true

# AI 路由标记
service.ai.route=true
service.ai.type=orderdemo
service.ai.mode=agent

# Agent 工具标签（langchain4j-tools 通过此标签关联工具路由）
ai.agent.tags=order-demo

# Agent 运行时提示词；模型 provider/base URL/API key/model name 由服务端 lightesb.ai.models.* 注册表和 lightesb.ai.agents.*.model-ref 管理
ai.system.prompt=你是一个订单管理助手。你可以帮助用户查询订单状态和列出客户最近订单。取消订单工具仅用于 mock 演示，必须在用户明确确认后才可调用，并传入 confirmed=true。请用中文回答。

# 外部 API 地址（真实订单接口替换时使用；当前 route 默认调用同服务 mock 子路由）
external.order.api.host=localhost:8080
external.order.api.basepath=/api/orders

# 调试配置
ai.debug=false
ai.debug.max.body.length=500

# 接口鉴权（空则放行）
ai.auth.token=

# 当前 route 会传入 CamelLangChain4jAgentMemoryId 作为会话标识。
# 全局开启 lightesb.ai.agents.chat.memory.enabled=true 后，同一 memoryId 使用 LangChain4j 窗口记忆。
# memoryId 为空时由 route 使用 exchangeId 自动生成；稳定多轮必须由调用方传入稳定 memoryId。
