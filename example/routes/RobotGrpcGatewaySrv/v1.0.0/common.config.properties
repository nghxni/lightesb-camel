# Robot gRPC gateway mock sample common config
HTTP.Listener=false
server.running=false
server.port=19206
port.level=version
system.components=robotics

SYSTEMID=CSIP
system.name=csip
system.version=1.0.0
system.description=LightESB robot gRPC gateway mock sample
service.type=HTTP
service.impl=GRPC
service.provider=LIGHTESB

robot.siteId=site-a
robot.default.type=quadruped
robot.command.allowedActions=move_to,stop
robot.command.allowedRobotIds=quad-001
robot.asset.quad-001.type=quadruped
robot.asset.quad-001.protocolProfile=grpc-v1
robot.asset.quad-001.capabilities=move_to,stop
robot.asset.quad-001.capability.move_to.version=move-base.v1
robot.asset.quad-001.online=true
robot.command.move_to.schemaKey=quadruped.move_to.move-base.v1
robot.policy.target.minX=0
robot.policy.target.maxX=20
robot.policy.target.minY=0
robot.policy.target.maxY=20
robot.policy.maxSpeed=0.8
robot.policy.maxPayloadKg=5.0

robot.grpc.enabled=false
robot.grpc.endpoint=
robot.grpc.service.command=RobotCommandService
robot.grpc.service.telemetry=RobotTelemetryService
robot.grpc.deadlineMs=30000
robot.grpc.retry.enabled=false
robot.grpc.retry.maxAttempts=1
robot.grpc.retry.initialBackoffMs=200
robot.grpc.retry.maxBackoffMs=2000
robot.grpc.metadata.allowedKeys=x-request-id,x-correlation-id,x-robot-id,x-site-id
robot.grpc.tls.enabled=false
robot.grpc.mtls.enabled=false
robot.grpc.tls.truststore.path.key=ROBOT_GRPC_TLS_TRUSTSTORE_PATH
robot.grpc.tls.truststore.password.key=ROBOT_GRPC_TLS_TRUSTSTORE_PASSWORD
robot.grpc.tls.keystore.path.key=ROBOT_GRPC_TLS_KEYSTORE_PATH
robot.grpc.tls.keystore.password.key=ROBOT_GRPC_TLS_KEYSTORE_PASSWORD
robot.grpc.allowDynamicEndpoint=false
robot.mock.grpc.command.sink=mock:robotGrpcCommandSink
robot.mock.grpc.telemetry.sink=mock:robotGrpcTelemetrySink
robot.mock.grpc.receipt.sink=mock:robotGrpcReceiptSink
