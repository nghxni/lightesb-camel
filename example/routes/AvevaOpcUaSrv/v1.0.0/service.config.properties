# AVEVA Plant SCADA OPC UA sample service config
service.name=AvevaOpcUaSrv
service.version=1.0.0
service.description=AVEVA Plant SCADA OPC UA telemetry and write-control sample
service.author=LightESB Team
service.instance.id=aveva-opcua-001
service.instance.name=AVEVA OPC UA Service Instance 1
service.environment=development

industrial.opcua.endpoint.uri=tcp://127.0.0.1:4840
industrial.opcua.client.id=lightesb-aveva-opcua
industrial.opcua.read.node=ns=2;s=Plant.Area.Line1.Pump101.Speed
industrial.opcua.write.node=ns=2;s=Plant.Area.Line1.Pump101.SetPoint
industrial.opcua.username=PLACEHOLDER_CONFIGURE_IN_SITE
industrial.opcua.password=PLACEHOLDER_CONFIGURE_IN_SITE
industrial.opcua.security=PLACEHOLDER_CONFIGURE_IN_SITE

actions.schema-version=1
actions.ids=aveva-opcua-telemetry
action.aveva-opcua-telemetry.route-id=aveva-opcua-read-telemetry
action.aveva-opcua-telemetry.name=AVEVA OPC UA telemetry consumer
action.aveva-opcua-telemetry.description=Read OPC UA telemetry, normalize the Milo value, and forward it to the configured HTTP target
action.aveva-opcua-telemetry.interaction-pattern=oneWayConsumer
action.aveva-opcua-telemetry.agent-callable=false
action.aveva-opcua-telemetry.side-effect=write
action.aveva-opcua-telemetry.idempotency=none
action.aveva-opcua-telemetry.retry-policy=none
action.aveva-opcua-telemetry.approval-required=false
action.aveva-opcua-telemetry.exposure=internal
action.aveva-opcua-telemetry.required-config-keys=industrial.opcua.endpoint.uri,industrial.opcua.client.id,industrial.opcua.read.node,industrial.target.http.uri,industrial.target.http.connectTimeout,industrial.target.http.socketTimeout,industrial.log.max.body.length
action.aveva-opcua-telemetry.credential-aliases=
action.aveva-opcua-telemetry.required-scopes=
