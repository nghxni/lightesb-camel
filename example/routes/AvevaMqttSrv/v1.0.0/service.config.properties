# AVEVA Plant SCADA MQTT 5 sample service config
service.name=AvevaMqttSrv
service.version=v1.0.0
service.description=AVEVA Plant SCADA MQTT 5 telemetry and command sample
service.author=LightESB Team
service.instance.id=aveva-mqtt-001
service.instance.name=AVEVA MQTT Service Instance 1
service.environment=development

industrial.mqtt.broker.url=tcp://127.0.0.1:1883
industrial.mqtt.client.id=lightesb-aveva-mqtt
industrial.mqtt.telemetry.topic=aveva/plant/telemetry/line1
industrial.mqtt.command.topic=aveva/plant/command
industrial.mqtt.qos=1
industrial.mqtt.command.retained=false
industrial.mqtt.username=PLACEHOLDER_CONFIGURE_IN_SITE
industrial.mqtt.password=PLACEHOLDER_CONFIGURE_IN_SITE
industrial.mqtt.tls=PLACEHOLDER_CONFIGURE_IN_SITE

actions.schema-version=1
actions.ids=aveva-mqtt-telemetry
action.aveva-mqtt-telemetry.route-id=aveva-mqtt-telemetry-consumer
action.aveva-mqtt-telemetry.name=AVEVA MQTT telemetry consumer
action.aveva-mqtt-telemetry.description=Consume MQTT telemetry, normalize it, and forward it to the configured HTTP target
action.aveva-mqtt-telemetry.interaction-pattern=oneWayConsumer
action.aveva-mqtt-telemetry.agent-callable=false
action.aveva-mqtt-telemetry.side-effect=write
action.aveva-mqtt-telemetry.idempotency=none
action.aveva-mqtt-telemetry.retry-policy=none
action.aveva-mqtt-telemetry.approval-required=false
action.aveva-mqtt-telemetry.exposure=internal
action.aveva-mqtt-telemetry.required-config-keys=industrial.mqtt.broker.url,industrial.mqtt.client.id,industrial.mqtt.telemetry.topic,industrial.mqtt.qos,industrial.mqtt.username,industrial.mqtt.password,industrial.target.http.uri,industrial.target.http.connectTimeout,industrial.target.http.socketTimeout,industrial.log.max.body.length
action.aveva-mqtt-telemetry.credential-aliases=
action.aveva-mqtt-telemetry.required-scopes=
