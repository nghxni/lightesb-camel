# Robot cluster data mock sample common config
HTTP.Listener=false
server.running=false
server.port=19230
port.level=version
system.components=robotics

SYSTEMID=CSIP
system.name=csip
system.version=1.0.0
system.description=LightESB robot cluster data mock sample
service.type=EVENT
service.impl=KAFKA_MOCK
service.provider=LIGHTESB

robot.siteId=site-a
robot.default.type=quadruped
robot.sourceProtocol=mqtt5
robot.cluster.kafka.telemetry.topic=robot.telemetry
robot.cluster.kafka.event.topic=robot.event
robot.cluster.task.callback.uri=mock:robotTaskCallbackSink
robot.mock.kafka.telemetry.sink=mock:robotKafkaTelemetrySink
robot.mock.kafka.event.sink=mock:robotKafkaEventSink
robot.mock.task.ingress.sink=mock:robotTaskIngressSink
robot.mock.dashboard.sink=mock:robotDashboardDataSink
